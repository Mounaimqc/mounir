<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="logo.jpeg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Gérer les Produits - Wahbi Zoghbi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #DC143C;
            --primary-dark: #b30000;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #050505;
            --surface: #111111;
            --text: #fff;
            --text-light: #888;
            --border: #333;
            --shadow: 0 8px 30px rgba(0, 0, 0, .5);
            --radius: 8px
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif
        }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100%;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
        }

        .logo img {
            height: 40px;
            width: auto;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .brand-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-tagline {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .nav-links {
            list-style: none;
            padding: 24px 16px;
            flex: 1
        }

        .nav-item {
            margin-bottom: 8px
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius);
            color: var(--text-light);
            text-decoration: none;
            transition: .2s
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
            font-weight: 500
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 32px;
            overflow-y: auto
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px
        }

        .page-title h1 {
            font-size: 1.5rem;
            font-weight: 700
        }

        .page-title p {
            color: var(--text-light);
            font-size: .875rem;
            margin-top: 4px
        }

        .actions-bar {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .filters {
            display: flex;
            gap: 12px;
            flex: 1;
            max-width: 500px;
        }

        .input-group {
            position: relative;
            flex: 1;
        }

        .input-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light)
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px 10px 10px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        .btn {
            padding: 10px 20px;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: .2s
        }

        .btn-primary {
            background: var(--primary);
            color: #000
        }

        .btn-primary:hover {
            background: var(--primary-dark)
        }

        .btn-outline {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text)
        }

        .btn-outline:hover {
            background: var(--border)
        }

        .table-container {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            background: var(--bg);
            padding: 16px;
            text-align: left;
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-light);
            font-weight: 600
        }

        td {
            padding: 16px;
            border-top: 1px solid var(--border);
            font-size: .875rem;
            vertical-align: middle
        }

        tr:hover {
            background: rgba(212, 175, 55, 0.05)
        }

        .product-img-td {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background: #fff;
            display: block;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: 700;
            display: inline-block
        }

        .status-in-stock {
            background: rgba(28, 208, 114, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-out-of-stock {
            background: rgba(255, 204, 0, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .action-btns {
            display: flex;
            gap: 8px
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            padding: 8px;
            border-radius: 4px
        }

        .icon-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary)
        }

        .icon-btn.delete:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1)
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000
        }

        .modal-overlay.active {
            display: flex
        }

        .modal {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .1);
            max-height: 90vh;
            overflow-y: auto
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .modal-body {
            padding: 24px
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light)
        }

        .form-group {
            margin-bottom: 16px
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: .875rem;
            font-weight: 500
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row>* {
            flex: 1;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius);
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn .3s ease;
            z-index: 9999
        }

        .toast.success {
            background: var(--success)
        }

        .toast.error {
            background: var(--danger)
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        /* ========== Responsive Enhancements ========== */

        .menu-toggle {
            display: none !important;
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                box-shadow: 2px 0 15px rgba(0, 0, 0, 0.3);
            }
            
            .sidebar.active {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            
            .menu-toggle {
                display: block !important;
            }
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            
            .page-title h1 {
                font-size: 1.25rem;
            }
            
            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filters {
                flex-direction: column;
                width: 100%;
                max-width: 100%;
            }
            
            .input-group input,
            .input-group select {
                padding: 12px 12px 12px 36px;
                font-size: 1rem;
            }
            
            .actions-bar div[style*="gap:10px"] {
                width: 100%;
                justify-content: center;
            }
            
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            table {
                min-width: 600px;
            }
            
            th, td {
                padding: 12px 8px;
                font-size: 0.8rem;
            }
            
            .product-img-td {
                width: 50px;
                height: 50px;
            }
            
            .action-btns {
                flex-direction: column;
                gap: 4px;
            }
            
            .icon-btn {
                padding: 6px;
            }
            
            .modal {
                width: 95%;
                max-width: 100%;
                max-height: 95vh;
                margin: 10px;
            }
            
            .modal-body {
                padding: 16px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 10px;
            }
            
            .toast {
                left: 10px;
                right: 10px;
                width: auto;
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            .sidebar-header {
                padding: 16px;
            }
            
            .brand-name {
                font-size: 1rem;
            }
            
            .brand-tagline {
                font-size: 0.65rem;
                letter-spacing: 2px;
            }
            
            .nav-link {
                padding: 10px;
                font-size: 0.9rem;
            }
            
            .nav-link i {
                font-size: 1rem;
            }
            
            .page-title h1 {
                font-size: 1.1rem;
            }
            
            .page-title p {
                font-size: 0.8rem;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
            
            .btn i {
                font-size: 0.9rem;
            }
            
            td:nth-child(2) {
                max-width: 120px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            .status-badge {
                padding: 3px 8px;
                font-size: 0.7rem;
            }
            
            .modal-header h3 {
                font-size: 1.1rem;
            }
            
            .close-modal {
                font-size: 1.3rem;
                padding: 4px 8px;
            }
            
            .form-label {
                font-size: 0.8rem;
            }
            
            .form-control {
                padding: 8px;
                font-size: 0.9rem;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .modal {
                max-height: 100vh;
                border-radius: 0;
            }
            
            .modal-body {
                max-height: 60vh;
                overflow-y: auto;
            }
        }

        @media print {
            .sidebar, .actions-bar, .action-btns {
                display: none !important;
            }
            
            .main-content {
                margin: 0;
                padding: 0;
            }
            
            .table-container {
                box-shadow: none;
            }
        }

        /* Card view for mobile (Optional - uncomment to use) */
        /*
        @media (max-width: 600px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { margin-bottom: 16px; background: var(--bg); border-radius: var(--radius); padding: 12px; border: 1px solid var(--border); }
            td { border: none; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; text-align: right; border-bottom: 1px dashed var(--border); }
            td:last-child { border-bottom: none; }
            td::before { content: attr(data-label); font-weight: 600; color: var(--text-light); font-size: 0.75rem; text-transform: uppercase; margin-right: 10px; }
            .product-img-td { margin: 0 auto 10px; display: block; }
            .action-btns { justify-content: center; flex-direction: row; }
        }
        */
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo" style="text-decoration: none;">
                <img src="logo.jpeg" alt="Logo">
                <div class="logo-text">
                    <div class="brand-name">Wahbi Zoghbi</div>
                    <div class="brand-tagline">Nutrition</div>
                </div>
            </a>
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="admin.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a href="gerer-produits.html" class="nav-link active"><i class="fa-solid fa-boxes-stacked"></i> Gérer les Produits</a></li>
            <li class="nav-item"><a href="index.html" class="nav-link" target="_blank"><i class="fa-solid fa-store"></i> Voir le Site</a></li>
            <li class="nav-item"><a href="login.html" class="nav-link"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <div style="display:flex; align-items:center; gap: 15px;">
                <button class="menu-toggle" 
                        onclick="toggleSidebar()" 
                        aria-label="Toggle menu"
                        style="display:none; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; padding: 8px;">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="page-title">
                    <h1>📦 Gérer les Produits</h1>
                    <p>Gérez votre inventaire, modifiez les prix, et mettez à jour les stocks.</p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
                <div style="width:40px;height:40px;background:var(--primary);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700">W</div>
                <div>
                    <div style="font-weight:600;font-size:.875rem">Wahbi</div>
                    <div style="font-size:.75rem;color:var(--text-light)">Super Utilisateur</div>
                </div>
            </div>
        </div>

        <div class="actions-bar">
            <div class="filters">
                <div class="input-group"><i class="fa-solid fa-search"></i><input type="text" id="searchInput" placeholder="Rechercher par nom..."></div>
                <div class="input-group">
                    <select id="filterCategory">
                        <option value="">Toutes les catégories</option>
                        <option value="Protéines whey">Protéines whey</option>
                        <option value="Masse / Gainer">Masse / Gainer</option>
                        <option value="Acide aminé">Acide aminé</option>
                        <option value="Force / Energie">Force / Energie</option>
                        <option value="Brûleur de graisse">Brûleur de graisse</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
            </div>
            <div style="display:flex;gap:10px">
                <button class="btn btn-outline" onclick="clearFilters()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Nom</th>
                        <th>Catégorie</th>
                        <th>Prix</th>
                        <th>Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center;padding:40px;color:var(--text-light)"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Edit Product Modal -->
    <div class="modal-overlay" id="editProductModal">
        <div class="modal">
            <div class="modal-header">
                <h3>✏️ Modifier Produit</h3><button class="close-modal" onclick="closeEditProductModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editProductForm">
                    <input type="hidden" id="editProductId">
                    <div class="form-group"><label class="form-label">Nom du produit *</label><input type="text" id="editProductName" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">URL de l'image *</label><input type="url" id="editProductImage" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">Catégorie *</label><select id="editProductCategory" class="form-control" required>
                            <option value="">Sélectionner...</option>
                              <option value="Protéines whey">Protéines whey</option>
                        <option value="Masse / Gainer">Masse / Gainer</option>
                        <option value="Acide aminé">Acide aminé</option>
                        <option value="Force / Energie">Force / Energie</option>
                        <option value="Brûleur de graisse">Brûleur de graisse</option>
                        <option value="Autre">Autre</option
                        </select></div>
                    <div class="form-group"><label class="form-label">Description</label><textarea id="editProductDescription" class="form-control" rows="3"></textarea></div>
                    <div class="form-group"><label class="form-label">Inventaire (Stock) *</label><input type="number" id="editProductQuantity" class="form-control" required min="0"></div>
                    <div class="form-group"><label class="form-label">Prix (DA) *</label><input type="number" id="editProductPrice" class="form-control" required min="0"></div>

                    <!-- Section Goûts -->
                    <div class="form-group" style="border: 1px solid var(--border); padding: 15px; border-radius: var(--radius); margin-top: 15px;">
                        <label class="form-label" style="display: flex; justify-content: space-between; align-items: center;">
                            Goûts / Variantes (Optionnel)
                            <button type="button" class="btn btn-outline" style="padding: 4px 8px; font-size: 0.8rem;" onclick="addEditFlavorField()">+ Ajouter un goût</button>
                        </label>
                        <div id="editFlavorsList" style="display:flex; flex-direction:column; gap:10px;"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeEditProductModal()">Annuler</button>
                <button class="btn btn-primary" type="submit" form="editProductForm">✅ Enregistrer les modifs</button>
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="gerer-produits.js"></script>
    
    <!-- Scripts Responsive -->
    <script>
        // Toggle sidebar on mobile
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            const sidebar = document.querySelector('.sidebar');
            const toggle = document.querySelector('.menu-toggle');
            
            if (window.innerWidth <= 1024 && 
                sidebar.classList.contains('active') && 
                !sidebar.contains(e.target) && 
                toggle && !toggle.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });

        // Close modal when clicking outside
        document.getElementById('editProductModal').addEventListener('click', (e) => {
            if (e.target.id === 'editProductModal') {
                closeEditProductModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEditProductModal();
                if (window.innerWidth <= 1024) {
                    document.querySelector('.sidebar').classList.remove('active');
                }
            }
        });

        // Handle window resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window.innerWidth > 1024) {
                    document.querySelector('.sidebar').classList.remove('active');
                }
            }, 250);
        });
    </script>
</body>
</html>
