<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Amar Informatique</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --background: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #6B7280;
            margin-bottom: 32px;
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1E40AF;
        }
        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #9CA3AF;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🔐 Amar Informatique</div>
        <div class="subtitle">Accès réservé aux administrateurs</div>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Accéder au Dashboard</button>
        </form>

        <div class="footer">
            &copy; 2026 Amar Informatique
        </div>
    </div>

    <script>
        // Simple Client-Side Auth (Note: Insecure for production, use Firebase Auth for real security)
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            // Change this password securely
            if(pass === "admin123") { 
                window.location.href = "admin.html";
            } else {
                alert("Mot de passe incorrect");
            }
        });
    </script>
</body>
</html>
