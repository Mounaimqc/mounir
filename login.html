<!DOCTYPE html>
<html lang="fr">

<head>
  <link rel="icon" href="logo.jpeg" type="image/x-icon">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin - Wahbi Zoghbi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ffcc00;
      --primary-dark: #D4AF37;
      --bg: #050505;
      --surface: #111111;
      --text: #fff;
      --text-light: #888;
      --border: #333;
      --radius: 12px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, .5)
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px
    }

    .login-card {
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 48px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      text-align: center
    }

    .logo {
      color: var(--text);
      font-size: 1.75rem;
      font-weight: 900;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px
    }

    .logo span {
      color: var(--primary)
    }

    .subtitle {
      color: var(--text-light);
      margin-bottom: 32px;
      font-size: .9rem
    }

    .input-group {
      margin-bottom: 24px;
      text-align: left
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: .875rem;
      font-weight: 500;
      color: var(--text)
    }

    .input-wrapper {
      position: relative
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light)
    }

    input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 1px solid var(--border);
      background: #000;
      color: #fff;
      border-radius: var(--radius);
      font-size: 1rem;
      transition: .2s
    }

    input:focus {
      outline: none;
      border-color: var(--primary)
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px)
    }

    .back-link {
      display: block;
      margin-top: 24px;
      color: var(--text-light);
      font-size: .875rem;
      text-decoration: none
    }

    .back-link:hover {
      color: var(--primary)
    }

    .footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: .8rem;
      color: var(--text-light)
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ef4444;
      color: #fff;
      padding: 14px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 9999;
      animation: slideIn .3s ease
    }

    .toast.show {
      display: flex
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">WAHBI <span>ZOGHBI</span></div>
    <p class="subtitle">Accès réservé aux administrateurs</p>
    <form id="loginForm">
      <div class="input-group">
        <label>Mot de passe</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-key"></i>
          <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
        </div>
      </div>
      <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Accéder au Dashboard</button>
    </form>
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Retour au site</a>
    <div class="footer">
      <p>© 2026 Wahbi Zoghbi - Tous droits réservés</p>
    </div>
  </div>
  <div class="toast" id="toast"><i class="fa-solid fa-circle-exclamation"></i><span id="toastMsg"></span></div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      // ⚠️ Change this password in production!
      if (pass === "admin123") { window.location.href = "admin.html"; }
      else { showToast("Mot de passe incorrect"); }
    });
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>

</html>
